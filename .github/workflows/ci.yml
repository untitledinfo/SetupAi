name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only test dependencies
        # Full requirements.txt pulls torch/transformers, which is
        # overkill for CI that only exercises config/API/health tests.
        # Install the minimal set those tests actually need.
        run: |
          pip install fastapi "uvicorn[standard]" pydantic pyyaml httpx pytest

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -v
