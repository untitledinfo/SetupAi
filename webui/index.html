<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIREWING 1.0 BETA — Web Assistant</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --panel-hover: #f1f1f4;
    --text: #1a1a1a;
    --text-muted: #6b6b70;
    --border: #e4e4e7;
    --accent: #d94f1e;
    --accent-hover: #b8410a;
    --bubble-user: #eef0f3;
    --bubble-assistant: #ffffff;
    --code-bg: #f0f0f2;
    --danger: #dc2626;
    --success: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --panel: #1e1e22;
      --panel-hover: #27272c;
      --text: #ececee;
      --text-muted: #9a9aa2;
      --border: #2e2e34;
      --accent: #ff7a3d;
      --accent-hover: #ff8f5c;
      --bubble-user: #292930;
      --bubble-assistant: #1e1e22;
      --code-bg: #111114;
      --danger: #ef4444;
      --success: #22c55e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }
  #sidebar {
    width: 280px;
    min-width: 240px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 15px;
    margin: 0 0 4px 0;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    display: inline-block;
  }
  .status-dot.online { background: var(--success); }
  .status-dot.offline { background: var(--danger); }
  .sidebar-header .sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  .btn-accent {
    background: var(--accent);
    color: white;
    width: 100%;
  }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--panel-hover);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger {
    background: transparent;
    color: var(--danger);
  }
  .btn-danger:hover { background: rgba(220, 38, 38, 0.1); }
  .btn-icon {
    padding: 4px 8px;
    font-size: 12px;
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-radius: 4px;
  }
  .btn-icon:hover { color: var(--text); background: var(--panel-hover); }

  .sidebar-section {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    overflow-y: auto;
  }
  .sidebar-section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 0 0 8px 0;
  }
  #conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .conv-item {
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
  }
  .conv-item:hover { background: var(--panel-hover); }
  .conv-item.active { background: var(--panel-hover); border-color: var(--border); font-weight: 600; }
  .conv-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  label { font-size: 11px; color: var(--text-muted); display: block; margin-top: 8px; }
  input, select, textarea {
    width: 100%;
    margin-top: 3px;
    padding: 6px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100%;
  }
  #top-bar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #active-conv-title {
    font-size: 14px;
    font-weight: 600;
  }
  .top-actions {
    display: flex;
    gap: 8px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 80ch;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.55;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }
  .msg .role-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .msg pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    position: relative;
    margin: 8px 0;
  }
  .msg pre .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 11px;
    padding: 3px 8px;
    background: var(--border);
    color: var(--text);
  }
  .msg code {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
  }
  .msg code:not(pre code) {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 4px;
  }
  #input-bar {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    background: var(--panel);
    align-items: flex-end;
  }
  #message-input {
    flex: 1;
    min-height: 44px;
    max-height: 180px;
    font-size: 14px;
    padding: 10px;
  }
  #send-btn {
    min-width: 80px;
    height: 42px;
  }
  #stop-btn {
    background: var(--danger);
    color: white;
    height: 42px;
    display: none;
  }
  #status-bar {
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 20px 8px 20px;
    background: var(--panel);
  }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    margin: auto;
    max-width: 400px;
  }
  .empty-state h3 { color: var(--text); font-size: 16px; margin-bottom: 6px; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>
      <span class="status-dot" id="server-status-dot"></span>
      FIREWING 1.0 BETA
    </h1>
    <div class="sub">Self-Hosted AI Platform</div>
    <button id="new-chat-btn" class="btn-accent">+ New conversation</button>
  </div>

  <div id="conv-list">
    <div style="font-size:11px; color:var(--text-muted); padding:4px;">Recent Chats</div>
  </div>

  <div class="sidebar-section">
    <h2>Configuration</h2>
    <label>API Base URL</label>
    <input id="base-url" value="http://localhost:8000" />

    <label>API Key</label>
    <input id="api-key" type="password" placeholder="Bearer key" />

    <label>Persona Preset</label>
    <select id="persona-select">
      <option value="default">Default Assistant</option>
      <option value="coding">Coding Expert</option>
      <option value="concise">Concise / Direct</option>
      <option value="creative">Creative Assistant</option>
    </select>

    <label>System Prompt</label>
    <textarea id="system-prompt">You are FIREWING, a helpful AI assistant. Be direct, accurate, and concise.</textarea>

    <div style="display:flex; gap:8px;">
      <div style="flex:1">
        <label>Temp: <span id="temp-val">0.7</span></label>
        <input id="temperature" type="range" min="0" max="1.5" step="0.05" value="0.7" />
      </div>
      <div style="width:75px">
        <label>Max Tokens</label>
        <input id="max-tokens" type="number" value="1024" min="1" max="8192" />
      </div>
    </div>
  </div>
</div>

<div id="main">
  <div id="top-bar">
    <div id="active-conv-title">New Conversation</div>
    <div class="top-actions">
      <button class="btn-secondary" id="export-md-btn">Export Markdown</button>
      <button class="btn-secondary" id="export-json-btn">Export JSON</button>
      <button class="btn-danger btn-secondary" id="clear-chat-btn">Clear Chat</button>
    </div>
  </div>

  <div id="chat">
    <div class="empty-state">
      <h3>Ready to assist</h3>
      <p>Send a message to begin chatting with FIREWING.</p>
    </div>
  </div>

  <div id="status-bar">Connecting to server...</div>

  <div id="input-bar">
    <textarea id="message-input" placeholder="Message FIREWING (Enter to send, Shift+Enter for new line)..." rows="1"></textarea>
    <button id="stop-btn">Stop</button>
    <button id="send-btn" class="btn-accent">Send</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const stopBtn = document.getElementById("stop-btn");
  const baseUrlEl = document.getElementById("base-url");
  const apiKeyEl = document.getElementById("api-key");
  const personaSelect = document.getElementById("persona-select");
  const systemPromptEl = document.getElementById("system-prompt");
  const tempEl = document.getElementById("temperature");
  const tempValEl = document.getElementById("temp-val");
  const maxTokensEl = document.getElementById("max-tokens");
  const statusBar = document.getElementById("status-bar");
  const newChatBtn = document.getElementById("new-chat-btn");
  const convListEl = document.getElementById("conv-list");
  const activeConvTitleEl = document.getElementById("active-conv-title");
  const statusDot = document.getElementById("server-status-dot");
  const exportMdBtn = document.getElementById("export-md-btn");
  const exportJsonBtn = document.getElementById("export-json-btn");
  const clearChatBtn = document.getElementById("clear-chat-btn");

  let currentConvId = null;
  let history = []; // [{role, content}]
  let abortController = null;
  let personasCache = {};

  // Load saved credentials from localStorage
  const savedKey = localStorage.getItem("firewing_api_key");
  if (savedKey) apiKeyEl.value = savedKey;
  const savedUrl = localStorage.getItem("firewing_base_url");
  if (savedUrl) baseUrlEl.value = savedUrl;

  apiKeyEl.addEventListener("change", () => localStorage.setItem("firewing_api_key", apiKeyEl.value.trim()));
  baseUrlEl.addEventListener("change", () => {
    localStorage.setItem("firewing_base_url", baseUrlEl.value.trim());
    checkHealth();
    loadConversations();
    loadPersonas();
  });

  tempEl.addEventListener("input", () => { tempValEl.textContent = tempEl.value; });

  function getBaseUrl() {
    return baseUrlEl.value.trim().replace(/\/$/, "");
  }

  function getHeaders() {
    const key = apiKeyEl.value.trim();
    return {
      "Content-Type": "application/json",
      ...(key ? { Authorization: `Bearer ${key}` } : {}),
    };
  }

  async function checkHealth() {
    try {
      const resp = await fetch(`${getBaseUrl()}/health`);
      if (resp.ok) {
        statusDot.className = "status-dot online";
        statusBar.textContent = "Server connected.";
      } else {
        statusDot.className = "status-dot offline";
        statusBar.textContent = `Server returned status ${resp.status}`;
      }
    } catch {
      statusDot.className = "status-dot offline";
      statusBar.textContent = "Server unreachable. Make sure FIREWING is running.";
    }
  }

  async function loadPersonas() {
    try {
      const resp = await fetch(`${getBaseUrl()}/v1/personas`, { headers: getHeaders() });
      if (!resp.ok) return;
      const data = await resp.json();
      if (data.personas) {
        personaSelect.innerHTML = "";
        data.personas.forEach(p => {
          personasCache[p.name] = p;
          const opt = document.createElement("option");
          opt.value = p.name;
          opt.textContent = p.name.charAt(0).toUpperCase() + p.name.slice(1);
          personaSelect.appendChild(opt);
        });
      }
    } catch {}
  }

  personaSelect.addEventListener("change", () => {
    const p = personasCache[personaSelect.value];
    if (p) {
      systemPromptEl.value = p.system_prompt;
      tempEl.value = p.temperature;
      tempValEl.textContent = p.temperature;
    }
  });

  async function loadConversations() {
    try {
      const resp = await fetch(`${getBaseUrl()}/v1/conversations`, { headers: getHeaders() });
      if (!resp.ok) return;
      const data = await resp.json();
      renderConvList(data.conversations || []);
    } catch {}
  }

  function renderConvList(convs) {
    convListEl.innerHTML = '<div style="font-size:11px; color:var(--text-muted); padding:4px;">Recent Chats</div>';
    convs.forEach(c => {
      const item = document.createElement("div");
      item.className = `conv-item ${c.conversation_id === currentConvId ? "active" : ""}`;
      item.innerHTML = `
        <span class="conv-title">${escapeHtml(c.title || "Untitled")}</span>
        <button class="btn-icon delete-conv" title="Delete chat">✕</button>
      `;
      item.querySelector(".conv-title").addEventListener("click", () => switchConversation(c.conversation_id));
      item.querySelector(".delete-conv").addEventListener("click", (e) => {
        e.stopPropagation();
        deleteConversation(c.conversation_id);
      });
      convListEl.appendChild(item);
    });
  }

  async function switchConversation(convId) {
    try {
      const resp = await fetch(`${getBaseUrl()}/v1/conversations/${convId}`, { headers: getHeaders() });
      if (!resp.ok) return;
      const data = await resp.json();
      currentConvId = data.conversation_id;
      activeConvTitleEl.textContent = data.title;
      chatEl.innerHTML = "";
      history = [];

      if (data.persona && personasCache[data.persona]) {
        personaSelect.value = data.persona;
        systemPromptEl.value = personasCache[data.persona].system_prompt;
      }

      if (data.messages && data.messages.length > 0) {
        data.messages.forEach(m => {
          addMessageBubble(m.role, m.content);
          history.push({ role: m.role, content: m.content });
        });
      } else {
        chatEl.innerHTML = '<div class="empty-state"><h3>Empty conversation</h3><p>Send a message to start.</p></div>';
      }
      loadConversations();
    } catch (err) {
      statusBar.textContent = `Error loading conversation: ${err.message}`;
    }
  }

  async function createNewConversation(title = "New conversation") {
    try {
      const resp = await fetch(`${getBaseUrl()}/v1/conversations`, {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify({
          title: title,
          persona: personaSelect.value,
          system_prompt: systemPromptEl.value,
        }),
      });
      if (!resp.ok) throw new Error("Failed to create conversation");
      const data = await resp.json();
      currentConvId = data.conversation_id;
      activeConvTitleEl.textContent = data.title;
      history = [];
      chatEl.innerHTML = '<div class="empty-state"><h3>New conversation started</h3><p>Send a message to begin.</p></div>';
      loadConversations();
      return currentConvId;
    } catch (err) {
      statusBar.textContent = `Error: ${err.message}`;
      return null;
    }
  }

  async function deleteConversation(convId) {
    if (!confirm("Are you sure you want to delete this conversation?")) return;
    try {
      await fetch(`${getBaseUrl()}/v1/conversations/${convId}`, {
        method: "DELETE",
        headers: getHeaders(),
      });
      if (currentConvId === convId) {
        currentConvId = null;
        activeConvTitleEl.textContent = "New Conversation";
        chatEl.innerHTML = '<div class="empty-state"><h3>Ready to assist</h3><p>Send a message to begin chatting.</p></div>';
        history = [];
      }
      loadConversations();
    } catch {}
  }

  newChatBtn.addEventListener("click", () => {
    currentConvId = null;
    activeConvTitleEl.textContent = "New Conversation";
    chatEl.innerHTML = '<div class="empty-state"><h3>Ready to assist</h3><p>Send a message to begin chatting.</p></div>';
    history = [];
    statusBar.textContent = "New conversation ready.";
  });

  clearChatBtn.addEventListener("click", async () => {
    if (!currentConvId) {
      chatEl.innerHTML = '<div class="empty-state"><h3>Ready to assist</h3><p>Send a message to begin chatting.</p></div>';
      history = [];
      return;
    }
    if (!confirm("Clear message history in this conversation?")) return;
    await fetch(`${getBaseUrl()}/v1/conversations/${currentConvId}/clear`, {
      method: "POST",
      headers: getHeaders(),
    });
    switchConversation(currentConvId);
  });

  exportMdBtn.addEventListener("click", async () => {
    if (!currentConvId) {
      alert("No active conversation to export.");
      return;
    }
    window.open(`${getBaseUrl()}/v1/conversations/${currentConvId}/export?format=markdown`, "_blank");
  });

  exportJsonBtn.addEventListener("click", async () => {
    if (!currentConvId) {
      alert("No active conversation to export.");
      return;
    }
    window.open(`${getBaseUrl()}/v1/conversations/${currentConvId}/export?format=json`, "_blank");
  });

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function renderMarkdown(text) {
    const escaped = escapeHtml(text);
    let html = escaped.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      return `<pre><button class="copy-btn" onclick="navigator.clipboard.writeText(this.nextSibling.textContent)">Copy</button><code class="lang-${lang}">${code}</code></pre>`;
    });
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return html;
  }

  function addMessageBubble(role, initialText) {
    const empty = chatEl.querySelector(".empty-state");
    if (empty) empty.remove();

    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const label = document.createElement("div");
    label.className = "role-label";
    label.innerHTML = `<span>${role === "user" ? "You" : (role === "system" ? "System" : "FIREWING")}</span>`;

    const content = document.createElement("div");
    content.className = "content";
    content.innerHTML = renderMarkdown(initialText || "");

    wrap.appendChild(label);
    wrap.appendChild(content);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return content;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    if (!currentConvId) {
      const title = text.slice(0, 30) + (text.length > 30 ? "..." : "");
      currentConvId = await createNewConversation(title);
    }

    inputEl.value = "";
    sendBtn.style.display = "none";
    stopBtn.style.display = "inline-block";
    statusBar.textContent = "Generating response...";

    addMessageBubble("user", text);
    history.push({ role: "user", content: text });

    const assistantContentEl = addMessageBubble("assistant", "");
    let assistantText = "";

    abortController = new AbortController();

    const body = {
      message: { role: "user", content: text },
      temperature: parseFloat(tempEl.value),
      max_tokens: parseInt(maxTokensEl.value, 10),
      stream: true,
    };

    try {
      const resp = await fetch(`${getBaseUrl()}/v1/conversations/${currentConvId}/messages`, {
        method: "POST",
        headers: getHeaders(),
        body: JSON.stringify(body),
        signal: abortController.signal,
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        throw new Error(errData?.detail || errData?.error?.message || `HTTP ${resp.status}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() ?? "";
        for (const chunk of chunks) {
          if (!chunk.startsWith("data: ")) continue;
          const payload = chunk.slice(6).trim();
          if (payload === "[DONE]") continue;

          // Parse JSON if structured chunk, else treat as raw string
          if (payload.startsWith("{")) {
            try {
              const parsed = JSON.parse(payload);
              const delta = parsed.choices?.[0]?.delta?.content ?? parsed.content ?? "";
              assistantText += delta;
            } catch {
              assistantText += payload;
            }
          } else {
            assistantText += payload;
          }

          assistantContentEl.innerHTML = renderMarkdown(assistantText);
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }

      history.push({ role: "assistant", content: assistantText });
      statusBar.textContent = "Done.";
      loadConversations();
    } catch (err) {
      if (err.name === "AbortError") {
        statusBar.textContent = "Generation stopped by user.";
      } else {
        statusBar.textContent = `Error: ${err.message}`;
        assistantContentEl.innerHTML = `<em style="color:var(--danger)">Request failed: ${escapeHtml(err.message)}</em>`;
      }
    } finally {
      abortController = null;
      sendBtn.style.display = "inline-block";
      stopBtn.style.display = "none";
      inputEl.focus();
    }
  }

  stopBtn.addEventListener("click", () => {
    if (abortController) {
      abortController.abort();
    }
  });

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
