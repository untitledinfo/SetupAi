# LoRA fine-tuning defaults for FIREWING. Copy and adjust per run —
# these are reasonable starting points, not tuned for any specific
# dataset. Validate loss curves yourself; don't assume these are optimal.

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

learning_rate: 0.0002
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
bf16: true
