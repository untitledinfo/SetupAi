[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setup-ai"
version = "1.0.0b1"
description = "Setup AI — installer, CLI, and API server for FIREWING 1.0 BETA"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.51",
    "accelerate>=0.30",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
setup-ai = "setup_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["firewing*", "setup_ai*"]
